<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Graph</title>
<link rel="stylesheet" href="static/app.css?v={{V}}">
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <h1>Space Graph</h1>
    <input type="search" id="q" placeholder="Filter pages..." autocomplete="off">
    <button id="reset">Fit view</button>
    <button id="refresh">Refresh</button>
    <button id="labels" title="Cycle labels: hubs only, every page, or none">Labels: hubs</button>
    <button id="toggle-panel" title="Layout controls">Controls</button>
    <button id="toggle-3d" title="Switch between the 2D canvas and a 3D WebGL view">3D</button>
    <button id="theme" title="Theme: follow system, light, or dark">Theme: auto</button>
    <span class="spacer"></span>
    <span class="stats" id="stats">loading...</span>
  </div>

  <div id="stage">
    <div id="graph"></div>
    <div id="graph3d" hidden></div>

    <aside class="panel" id="panel" hidden>
      <div class="panel-head">
        <strong id="panel-title">Layout</strong>
        <button id="panel-close" title="Close">&times;</button>
      </div>
      <div id="controls"></div>
      <div class="panel-foot">
        <button id="unpin">Unpin all nodes</button>
        <button id="defaults">Reset to defaults</button>
      </div>
      <div class="panel-note">Settings are saved in this browser.</div>
    </aside>

    <div class="legend" id="legend"></div>
    <div class="perf" id="perf"></div>
  </div>
</div>

<script src="static/vendor/d3.min.js"></script>
<script src="static/graph.js?v={{V}}"></script>
<script src="static/graph3d.js?v={{V}}"></script>
<script>window.SB_ASSET_V = "{{V}}";</script>
<script>
(function () {
  var statsEl = document.getElementById("stats");
  var legendEl = document.getElementById("legend");
  var perfEl = document.getElementById("perf");

  var view = GraphView({
    container: "#graph",
    compact: false,
    onStats: function (s, payload) {
      statsEl.textContent =
        s.pages + " pages  |  " + s.edges + " links  |  " + s.unresolved + " unresolved";
      drawLegend();
      lastPayload = payload;
      push3d(false);
    }
  });

  /* ---- layout controls ---- */
  var SLIDERS = [
    { key: "charge",       label: "Repulsion",     min: -800, max: -20, step: 10,
      hint: "How hard nodes push each other apart. More negative spreads the graph out." },
    { key: "linkDistance", label: "Link distance", min: 10,  max: 220, step: 5,
      hint: "Preferred length of each edge." },
    { key: "linkStrength", label: "Link rigidity", min: 0,   max: 1,   step: 0.05,
      hint: "How strictly edges hold that length. Low is loose and organic." },
    { key: "collide",      label: "Node spacing",  min: 0,   max: 40,  step: 1,
      hint: "Minimum clear space around each node, on top of its radius." },
    { key: "gravity",      label: "Gravity",       min: 0,   max: 0.3, step: 0.01,
      hint: "Pull toward the centre. Raise it to gather orphan pages in." },
    { key: "nodeScale",    label: "Node size",     min: 0.4, max: 3,   step: 0.1,
      hint: "Multiplier on node radius." },
    { key: "labelDegree",  label: "Label cutoff",  min: 0,   max: 25,  step: 1,
      hint: "Hide labels for pages with fewer links than this. 0 shows everything." }
  ];

  /* The 3D view has its own, much shorter control set: most 2D sliders drive
     a d3 force simulation that does not exist over there. Label settings are
     shared with 2D rather than duplicated, so the toolbar button means one
     thing everywhere. */
  var SLIDERS_3D = [
    { key: "nodeSize",    label: "Node size",    min: 0.4, max: 3, step: 0.1, own: true,
      hint: "Multiplier on node size." },
    { key: "linkOpacity", label: "Link opacity", min: 0,   max: 1, step: 0.05, own: true,
      hint: "Fade the links back to let the nodes and labels read." },
    { key: "labelDegree", label: "Label cutoff", min: 0,   max: 25, step: 1,
      hint: "Hide labels for pages with fewer links than this. 0 shows everything." }
  ];

  var TOGGLES_3D = [
    { key: "showLabels",     label: "Show labels" },
    { key: "showUnresolved", label: "Show unresolved (broken links)" }
  ];

  var TOGGLES = [
    { key: "showLabels",     label: "Show labels" },
    { key: "showUnresolved", label: "Show unresolved (broken links)" },
    { key: "pinOnDrag",      label: "Pin nodes where I drop them",
      hint: "Off: a dragged node springs back into the layout, like Obsidian. " +
            "On: it stays put. Double-click a node to unpin it, or double-click " +
            "empty space to unpin everything." }
  ];

  var controlsEl = document.getElementById("controls");
  var inputs = {};

  function buildControls() {
    if (in3d) { build3dControls(); return; }
    controlsEl.innerHTML = "";
    var P = view.params();

    SLIDERS.forEach(function (c) {
      var row = document.createElement("div");
      row.className = "ctl";

      var lab = document.createElement("label");
      lab.textContent = c.label;
      var val = document.createElement("span");
      val.className = "val";
      val.textContent = P[c.key];
      lab.appendChild(val);

      var input = document.createElement("input");
      input.type = "range";
      input.min = c.min; input.max = c.max; input.step = c.step;
      input.value = P[c.key];
      input.title = c.hint;
      input.addEventListener("input", function () {
        var v = parseFloat(input.value);
        val.textContent = v;
        view.setParam(c.key, v);
      });

      var hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = c.hint;

      row.appendChild(lab);
      row.appendChild(input);
      row.appendChild(hint);
      controlsEl.appendChild(row);
      inputs[c.key] = { input: input, val: val };
    });

    TOGGLES.forEach(function (c) {
      var row = document.createElement("div");
      row.className = "ctl ctl-check";
      var lab = document.createElement("label");
      var input = document.createElement("input");
      input.type = "checkbox";
      input.checked = !!P[c.key];
      input.addEventListener("change", function () {
        view.setParam(c.key, input.checked);
      });
      lab.appendChild(input);
      lab.appendChild(document.createTextNode(" " + c.label));
      row.appendChild(lab);
      if (c.hint) {
        var h = document.createElement("div");
        h.className = "hint";
        h.textContent = c.hint;
        row.appendChild(h);
      }
      controlsEl.appendChild(row);
      inputs[c.key] = { input: input };
    });

    // Freeze is view state, not a saved layout parameter.
    var frow = document.createElement("div");
    frow.className = "ctl ctl-check";
    var flab = document.createElement("label");
    var fin = document.createElement("input");
    fin.type = "checkbox";
    fin.addEventListener("change", function () { view.freeze(fin.checked); });
    flab.appendChild(fin);
    flab.appendChild(document.createTextNode(" Freeze layout"));
    frow.appendChild(flab);
    var fhint = document.createElement("div");
    fhint.className = "hint";
    fhint.textContent = "Stop the simulation. Nodes stay where they are and stop drifting.";
    frow.appendChild(fhint);
    controlsEl.appendChild(frow);
  }

  /* 3D controls. Deliberately a separate builder rather than a filtered version
     of the 2D one: the two panels share only their look, and the 3D sliders
     write to a different object. */
  function build3dControls() {
    controlsEl.innerHTML = "";
    var P = view.params();
    var P3 = g3d ? g3d.params() : { nodeSize: 1, linkOpacity: 0.35 };

    SLIDERS_3D.forEach(function (c) {
      var row = document.createElement("div");
      row.className = "ctl";
      var lab = document.createElement("label");
      lab.textContent = c.label;
      var val = document.createElement("span");
      val.className = "val";
      var start = c.own ? P3[c.key] : P[c.key];
      val.textContent = start;
      lab.appendChild(val);

      var input = document.createElement("input");
      input.type = "range";
      input.min = c.min; input.max = c.max; input.step = c.step;
      input.value = start;
      input.title = c.hint;
      input.addEventListener("input", function () {
        var v = parseFloat(input.value);
        val.textContent = v;
        if (c.own) { if (g3d) g3d.setParam(c.key, v); }
        else { view.setParam(c.key, v); refreshLabels(); }
      });

      var hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = c.hint;
      row.appendChild(lab); row.appendChild(input); row.appendChild(hint);
      controlsEl.appendChild(row);
    });

    TOGGLES_3D.forEach(function (c) {
      var row = document.createElement("div");
      row.className = "ctl ctl-check";
      var lab = document.createElement("label");
      var input = document.createElement("input");
      input.type = "checkbox";
      input.checked = !!P[c.key];
      input.addEventListener("change", function () {
        view.setParam(c.key, input.checked);
        if (c.key === "showLabels") { refreshLabels(); paintLabelBtn(); }
        // The unresolved toggle changes which nodes exist in 3D, not just how
        // they look, so the filtered set has to be pushed again.
        if (c.key === "showUnresolved") push3d(true);
      });
      lab.appendChild(input);
      lab.appendChild(document.createTextNode(" " + c.label));
      row.appendChild(lab);
      controlsEl.appendChild(row);
    });

    var nav = document.createElement("div");
    nav.className = "hint";
    nav.textContent = "Drag to orbit, right-drag to pan, scroll to zoom. " +
      "Drag a node to move and pin it; click one to open the page.";
    controlsEl.appendChild(nav);
  }

  /* ---- labels ----
     One setting drives both views. The toolbar button cycles the three states
     people actually want; the panel's cutoff slider is the fine control behind
     it, and both stay in step because they read the same parameters. */
  var lastCutoff = 4;

  function labelMode() {
    var P = view.params();
    if (!P.showLabels) return "off";
    return P.labelDegree <= 0 ? "all" : "hubs";
  }

  function paintLabelBtn() {
    var m = labelMode();
    labelBtn.textContent = "Labels: " + m;
    labelBtn.classList.toggle("active", m === "all");
  }

  function refreshLabels() {
    if (!g3d || !g3d.isReady()) return;
    var P = view.params();
    g3d.setLabels({ show: !!P.showLabels, degree: P.labelDegree });
  }

  function setLabelMode(m) {
    if (m === "off") {
      view.setParam("showLabels", false);
    } else {
      view.setParam("showLabels", true);
      view.setParam("labelDegree", m === "all" ? 0 : (lastCutoff || 4));
    }
    paintLabelBtn();
    refreshLabels();
    buildControls();
  }

  function drawLegend() {
    legendEl.innerHTML = "";
    var folders = view.folders();
    var anyHidden = false;

    folders.forEach(function (f) {
      if (f.hidden) anyHidden = true;
      var row = document.createElement("div");
      row.className = "row" + (f.hidden ? " off" : "");
      row.tabIndex = 0;
      row.setAttribute("role", "switch");
      row.setAttribute("aria-checked", f.hidden ? "false" : "true");
      row.title = (f.hidden ? "Show " : "Hide ") + f.name;

      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = f.col;
      // `off` styling paints the ring from currentColor, so the swatch keeps
      // its own hue rather than turning grey.
      dot.style.color = f.col;

      var txt = document.createElement("span");
      txt.className = "name";
      txt.textContent = f.name;

      row.appendChild(dot);
      row.appendChild(txt);

      function toggle() { view.toggleFolder(f.name); drawLegend(); push3d(true); }
      row.addEventListener("click", toggle);
      row.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
      legendEl.appendChild(row);
    });

    if (anyHidden) {
      var hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = "click to show again";
      legendEl.appendChild(hint);
    }
  }

  /* ---- wiring ---- */
  var panel = document.getElementById("panel");
  var labelBtn = document.getElementById("labels");
  var CYCLE = ["hubs", "all", "off"];
  labelBtn.addEventListener("click", function () {
    var m = labelMode();
    // Remember the cutoff being left behind, so coming back to "hubs" restores
    // whatever the slider was set to rather than snapping to the default.
    if (m === "hubs") lastCutoff = view.params().labelDegree;
    setLabelMode(CYCLE[(CYCLE.indexOf(m) + 1) % CYCLE.length]);
  });
  document.getElementById("toggle-panel").addEventListener("click", function () {
    panel.hidden = !panel.hidden;
  });
  document.getElementById("panel-close").addEventListener("click", function () {
    panel.hidden = true;
  });
  document.getElementById("unpin").addEventListener("click", function () {
    if (in3d) { if (g3d) g3d.unpinAll(); return; }
    view.unpinAll();
  });
  document.getElementById("defaults").addEventListener("click", function () {
    // Each view resets its own settings. Resetting the 2D forces from the 3D
    // panel would silently rearrange a layout you cannot see.
    if (in3d) { if (g3d) g3d.resetParams(); }
    else view.resetParams();
    buildControls();
  });
  document.getElementById("q").addEventListener("input", function (e) {
    // Both views filter on the same string. In 2D non-matches drop out of the
    // draw; in 3D they stay in place but dim, because removing them would
    // re-run the layout and lose the frame you were looking at.
    view.setQuery(e.target.value);
    if (g3d && g3d.isReady()) g3d.setQuery(e.target.value);
  });
  document.getElementById("reset").addEventListener("click", function () {
    if (in3d) { if (g3d) g3d.fitNow(); return; }
    view.reset();
  });
  document.getElementById("refresh").addEventListener("click", function () {
    fetch("api/rebuild", { method: "POST" })
      .then(function () { return view.load(); })
      .catch(function (e) { console.warn(e); });
  });

  /* ---- 3D view ----
       Lives beside the 2D view rather than replacing it: the canvas renderer
       stays the default and the WebGL bundle is only fetched the first time
       someone presses this. Layout controls, search and the legend belong to
       the 2D simulation and are hidden while 3D is up rather than left visible
       and inert. */
  var g3d = null, in3d = false, lastPayload = null;
  var btn3d = document.getElementById("toggle-3d");
  var graph2dEl = document.getElementById("graph");
  var graph3dEl = document.getElementById("graph3d");

  function set3dChrome(on) {
    graph2dEl.classList.toggle("offstage", on);
    graph3dEl.hidden = !on;
    // The legend stays up in 3D: it is the colour key for what you are looking
    // at, and its folder switches drive both views.
    perfEl.hidden = on;
    document.getElementById("panel-title").textContent = on ? "3D view" : "Layout";
    // The panel, the search box and Fit view all mean something in 3D now, so
    // rebuild the panel for whichever view is up rather than disabling them.
    buildControls();
    if (g3d) g3d.setActive(on);
    btn3d.classList.toggle("active", on);
    btn3d.textContent = on ? "2D" : "3D";
  }

  /* The 3D view renders the same filtered set as 2D. The folder switches and
     the unresolved toggle live in the 2D view's state, so read them back rather
     than keeping a second copy that could drift. */
  function dataFor3d() {
    if (!lastPayload) return { nodes: [], links: [] };
    var hidden = {};
    view.folders().forEach(function (f) { if (f.hidden) hidden[f.name] = true; });
    var showGhosts = view.params().showUnresolved;
    var nodes = lastPayload.nodes.filter(function (n) {
      return (showGhosts || n.exists) && !hidden[n.folder];
    });
    var keep = {};
    nodes.forEach(function (n) { keep[n.id] = true; });
    var links = lastPayload.links.filter(function (l) {
      return keep[l.source] && keep[l.target];
    });
    return { nodes: nodes, links: links };
  }

  function push3d(refit) {
    if (!g3d || !g3d.isReady()) return;
    if (refit) g3d.refit();
    g3d.setData(dataFor3d());
  }

  function enter3d() {
    in3d = true;
    set3dChrome(true);
    btn3d.disabled = true;
    if (!g3d) {
      g3d = Graph3D({
        container: "#graph3d",
        sbUrl: (lastPayload && lastPayload.sbUrl) || "",
        // Reuse the 2D view's own colour scale so a folder is the same colour
        // in both views and the legend still describes what you are looking at.
        folderColour: function (name) {
          var f = view.folders();
          for (var i = 0; i < f.length; i++) if (f[i].name === name) return f[i].col;
          return "#7c9fe8";
        }
      });
    }
    var data = dataFor3d();
    (g3d.isReady() ? Promise.resolve(g3d.setData(data)) : g3d.start(data))
      .then(function () {
        btn3d.disabled = false;
        g3d.setActive(true);
        refreshLabels();
        g3d.setQuery(document.getElementById("q").value);
        buildControls();
      })
      .catch(function (e) {
        console.warn(e);
        statsEl.textContent = "3D unavailable: " + e.message;
        btn3d.disabled = false;
        leave3d();
      });
  }

  function leave3d() {
    in3d = false;
    set3dChrome(false);
    // Keep the instance alive so switching back is instant; only the WebGL
    // context would be costly to rebuild, and it is reused.
    view.reset();
  }

  btn3d.addEventListener("click", function () {
    if (in3d) leave3d(); else enter3d();
  });

  window.addEventListener("resize", function () { if (in3d && g3d) g3d.resize(); });

  /* ---- theme toggle: auto -> light -> dark ---- */
  var THEMES = ["auto", "light", "dark"];
  var themeBtn = document.getElementById("theme");
  function paintThemeBtn() { themeBtn.textContent = "Theme: " + view.theme(); }
  themeBtn.addEventListener("click", function () {
    var next = THEMES[(THEMES.indexOf(view.theme()) + 1) % THEMES.length];
    view.setTheme(next);
    paintThemeBtn();
    if (g3d && g3d.isReady()) g3d.repaintTheme();
  });
  paintThemeBtn();

  /* ---- rolling frame-time readout ---- */
  (function perf() {
    var last = performance.now(), acc = [], shown = 0;
    function tick(now) {
      var dt = now - last; last = now;
      if (dt < 500) acc.push(dt);
      if (acc.length >= 30) {
        acc.sort(function (a, b) { return a - b; });
        var med = acc[Math.floor(acc.length / 2)];
        acc = [];
        if (now - shown > 900) {
          shown = now;
          perfEl.textContent = med.toFixed(1) + " ms/frame";
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  paintLabelBtn();
  buildControls();
  view.load().then(function () { view.live(); }).catch(function (e) {
    statsEl.textContent = "error: " + e.message;
  });
})();
</script>
</body>
</html>
